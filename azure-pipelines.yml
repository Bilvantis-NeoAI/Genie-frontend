trigger:
- mains

pool:
  name: azurevm

steps:
  - task: Docker@2
    inputs:
      containerRegistry: 'amaniacr-testproj'
      repository: 'myapp'
      command: 'buildAndPush'
      Dockerfile: 'dockerfile'
      buildContext: '.'