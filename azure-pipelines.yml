trigger:
- main

pool:
  name: azurevm  # Or your self-hosted agent

steps:

# Login to Azure with the ARM service connection
- task: AzureCLI@2
  name: AzureLogin
  inputs:
    azureSubscription: 'azurevm-serconn'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Logged into Azure"
      az account show
      echo "Login to azure ACR"
      az acr login --name amaniacr
      echo "Loggined sucessfully"

