trigger:
- main

pool:
  name: azurevm  # Or your self-hosted agent

steps:
- task: Docker@2
  displayName: Build and push image
  inputs:
    containerRegistry: 'amani-serconn'   # service connection name
    repository: 'firstimage'
    command: 'buildAndPush'
    Dockerfile: '**/dockerfile'
    tags: |
      $(Build.BuildNumber)
      latest


